# Curation rules (merged over built-in defaults). Edit freely; restart the command to apply.

# Only songs SUNG in these languages are kept. Hindi film songs and ghazals are hindi/urdu;
# Bhojpuri / Awadhi / Maithili / Magahi folk is kept too.
# Add "punjabi" or "rajasthani" here if you want those songs too.
allowed_languages:
  - hindi
  - urdu
  - bhojpuri
  - awadhi
  - maithili
  - magahi
  # folk of the wider Hindi belt (18 Oct)
  - braj
  - rajasthani
  - haryanvi
  - garhwali
  - kumaoni

# film = Bollywood / Hindi film songs, ghazal, folk. Add "sufi", "classical", "devotional", "indie" to widen.
allowed_genres:
  - film
  - ghazal
  - folk
  # bhajans, for MastGaane FM's mornings
  - devotional
  # Hindi pop (Lucky Ali, Adnan Sami), qawwali / sufi, classical-based (18 Oct: "I want the Hindi ones")
  - indie
  - sufi
  - classical

# Always kept as ghazals.
ghazal_artists:
  - Jagjit Singh
  - Chitra Singh
  - Ghulam Ali
  - Mehdi Hassan
  - Begum Akhtar
  - Farida Khanum
  - Iqbal Bano
  - Pankaj Udhas
  - Talat Aziz
  - Talat Mahmood
  - Bhupinder Singh
  - Anup Jalota
  - Chandan Dass
  - Ahmed Hussain
  - Penaz Masani
  - Rekha Bhardwaj

# Always kept as folk (Bhojpuri unless the title says otherwise). Add singers you discover.
folk_artists:
  - Sharda Sinha
  - Bharat Sharma Vyas
  - Malini Awasthi
  - Chandan Tiwari
  - Kalpana Patowary
  - Mohammad Khalil
  - Madan Rai
  - Bharat Singh Bharti
  - Vindhyavasini Devi
  - Maithili Thakur

# A folk form named in the title or caption makes the song folk.
folk_keywords:
  - chhath
  - chhat geet
  - kajri
  - kajari
  - chaita
  - chaiti
  - sohar
  - birha
  - purbi
  - purvi
  - nirgun
  - lokgeet
  - lok geet
  - vivah geet
  - jhumar
  - faguwa
  - bidesiya
  - bhojpuri lok

# Searches that seed nightly discovery. Weighted toward 1990s–2000s ghazals and Bhojpuri folk;
# your approved songs (Rafi, Lata, Begum Akhtar…) keep the older classics coming too.
seed_queries:
  - Jagjit Singh 90s ghazal
  - Pankaj Udhas ghazal 1990s
  - Hariharan ghazal album
  - Talat Aziz ghazal
  - Jagjit Chitra Singh ghazal
  - 2000s Hindi ghazal
  - Hindi ghazal unplugged
  - Sharda Sinha Chhath geet
  - Bharat Sharma Vyas birha
  - Bhojpuri lokgeet purane
  - Chandan Tiwari lokgeet
  - Malini Awasthi kajri
  - Bhojpuri nirgun bhajan
  - Kalpana Patowary Bhojpuri folk

# Searches that fill each part of the day for MastGaane FM (morning bhakti, ghazals at night…).
# `mastgaane discover --time morning` runs them; the nightly run-all tops up any part of the day
# with fewer than 25 songs that suit it.
time_seeds:
  morning:
    - Anup Jalota bhajan
    - Hari Om Sharan bhajan
    - Lata Mangeshkar bhajan
    - Jagjit Singh bhajan
    - Anuradha Paudwal bhajan
    - Purane Hindi bhajan
    - Sharda Sinha bhakti geet
    - Pandit Jasraj bhajan
  afternoon:
    - Kishore Kumar happy songs
    - Old Hindi cheerful songs
    - Bhojpuri lokgeet purane
  evening:
    - Lata Rafi romantic duets
    - 90s romantic Hindi songs
  night:
    - Jagjit Singh ghazal
    - Ghulam Ali ghazal
    - Mehdi Hassan ghazal

