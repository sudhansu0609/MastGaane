[project]
name = "mastgaane"
version = "0.1.0"
description = "Harvest late-night Instagram Reels, identify the songs, build playlists on YouTube Music / Spotify / Apple Music."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "playwright>=1.47",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "ytmusicapi>=1.8",
    "spotipy>=2.24",
    "yt-dlp>=2024.8",
    "shazamio>=0.7",
    "faster-whisper>=1.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "edge-tts>=7.0",
    "psutil>=7.2.2",
    "audioop-lts>=0.2.2",
    "soundcard>=0.4.6",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "pycaw>=20240316",
]

[project.scripts]
mastgaane = "mastgaane.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mastgaane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
