# The big collection the jockey plays from (`uv run mastgaane library`; `--stats` shows it). Filled from
# YouTube Music — each singer's / composer's songs and albums, at most their number of kept songs — then the
# playlist searches, in turns; labelled by the local LLM (language sung, genre, mood, year) and gated by
# allowed_languages / allowed_genres above. Nearly all from before 2010: at most `modern_max` from 2010 on
# in the whole collection, your own songs included. Run it again to carry on, or after editing this list.
